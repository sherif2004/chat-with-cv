services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env  # your Azure values: copy .env.example to .env and fill them in
    environment:
      DATABASE_URL: postgresql://cvchat:cvchat@postgres:5432/cvchat  # overrides localhost from .env
      HF_HUB_OFFLINE: "1"  # the model comes from the mounted cache below: never go to the internet for it
      TRANSFORMERS_OFFLINE: "1"
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # The NER model (urchade/gliner_medium-v2.1 and its tokenizer) from your computer, read-only. Another folder: set HF_CACHE_DIR in .env.
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/opt/hf-cache:ro
      - appcache:/app/.cache  # CV layouts read by Document Intelligence, so re-indexing does not pay for them again

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvchat
      POSTGRES_PASSWORD: cvchat
      POSTGRES_DB: cvchat
    ports:
      - "127.0.0.1:5432:5432"  # local only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvchat"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  appcache:
