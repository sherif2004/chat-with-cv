# Streamlit theme. Without a "base", it follows the user's light or dark setting.
[theme]
primaryColor = "#5b47e0"
baseRadius = "large"
font = "sans-serif"

[theme.light]
primaryColor = "#5b47e0"
backgroundColor = "#f6f7fc"
secondaryBackgroundColor = "#e9ecf8"
textColor = "#1a1d2e"

[theme.dark]
primaryColor = "#a396ff"
backgroundColor = "#0e1220"
secondaryBackgroundColor = "#171d31"
textColor = "#e9ebf5"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
